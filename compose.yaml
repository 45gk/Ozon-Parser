services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ozon
      POSTGRES_USER: ozon
      POSTGRES_PASSWORD: ozon-dev
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ozon -d ozon"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  web:
    build: .
    ports:
      - "${WEB_PORT:-8000}:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://ozon:ozon-dev@db:5432/ozon
      CDP_URL: ${CDP_URL:-http://host.docker.internal:9222}
      OZON_COOKIE: ${OZON_COOKIE:-}
      PARSE_TIMEOUT: ${PARSE_TIMEOUT:-45}
      CHALLENGE_TIMEOUT: ${CHALLENGE_TIMEOUT:-120}
      DISPLAY_TIMEZONE: ${DISPLAY_TIMEZONE:-Europe/Moscow}
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  postgres_data:
